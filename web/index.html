<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Mensajería cifrada E2EE y videollamadas privadas">
  <meta name="theme-color" content="#1565C0">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SecureChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SecureChat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: #0d0d0d;
      overflow: hidden;
    }
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Dificulta captura de pantalla con marca de agua visual invisible */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 99999;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.008) 40px,
        rgba(255,255,255,0.008) 41px
      );
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      flex-direction: column;
      gap: 16px;
    }
    #loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #90a4ae; font-family: sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Firebase Phone Auth invisible reCAPTCHA container -->
  <div id="recaptcha-container"></div>

  <div id="loading">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="#1565C0" stroke-width="2" stroke-dasharray="31.4" stroke-dashoffset="10"/>
    </svg>
    <p>SecureChat</p>
  </div>

  <script>
    // Bloquear atajos de captura de pantalla en teclado
    document.addEventListener('keyup', function(e) {
      if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('').catch(() => {});
      }
    });
    // Bloquear menú contextual
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    // Bloquear combinaciones de teclado comunes de captura
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === '4' || e.key === '3')) {
        e.preventDefault();
      }
    });
  </script>

  <!-- Jitsi Meet IFrame API - carga diferida para no bloquear Flutter -->
  <script src="https://meet.jit.si/external_api.js" async></script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
