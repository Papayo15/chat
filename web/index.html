<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Mensajería cifrada E2EE y videollamadas privadas">
  <meta name="theme-color" content="#1565C0">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SecureChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SecureChat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: #0d0d0d;
      overflow: hidden;
    }
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 99999;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.008) 40px,
        rgba(255,255,255,0.008) 41px
      );
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      flex-direction: column;
      gap: 16px;
      z-index: 9998;
    }
    #loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-title { color: #90a4ae; font-family: sans-serif; font-size: 14px; }
    #loading-step {
      color: #546e7a;
      font-family: monospace;
      font-size: 11px;
      max-width: 320px;
      text-align: center;
    }
    #loading-error {
      display: none;
      color: #ef5350;
      font-family: monospace;
      font-size: 11px;
      max-width: 320px;
      text-align: center;
      padding: 8px 12px;
      border: 1px solid #ef5350;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Firebase Phone Auth invisible reCAPTCHA container -->
  <div id="recaptcha-container"></div>

  <div id="loading">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="#1565C0" stroke-width="2" stroke-dasharray="31.4" stroke-dashoffset="10"/>
    </svg>
    <p id="loading-title">SecureChat</p>
    <p id="loading-step">Iniciando…</p>
    <p id="loading-error"></p>
  </div>

  <script>
    // ── Step tracker visible on screen ────────────────────────────────────────
    function step(msg) {
      var el = document.getElementById('loading-step');
      if (el) el.textContent = msg;
    }
    function showError(msg) {
      var e = document.getElementById('loading-error');
      if (e) { e.style.display = 'block'; e.textContent = msg; }
      step('Error — ver mensaje arriba');
    }

    step('Cargando motor Flutter…');

    // ── Suppress Firebase/Safari IndexedDB unhandled rejections ──────────────
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      if (!reason) return;
      var name = reason.name || '';
      var msg  = (reason.message || '') + (reason.code || '');
      if (name === 'AbortError' || name === 'UnknownError' ||
          msg.indexOf('idb') !== -1 || msg.indexOf('IndexedDB') !== -1 ||
          msg.indexOf('object store') !== -1 ||
          msg.indexOf('long polling') !== -1 ||
          msg.indexOf('log polling') !== -1 ||
          msg.indexOf('log poling') !== -1 ||
          msg.indexOf('polling timeout') !== -1 ||
          msg.indexOf('timeout: null') !== -1 ||
          msg.indexOf('app/idb') !== -1) {
        event.preventDefault();
        return;
      }
      // Show unexpected JS errors on screen
      showError('[JS] ' + name + ': ' + msg.substring(0, 120));
    });

    window.addEventListener('error', function(event) {
      if (event.filename && event.filename.indexOf('external_api') !== -1) return;
      showError('[JS error] ' + (event.message || '').substring(0, 120));
    });
  </script>

  <script>
    document.addEventListener('keyup', function(e) {
      if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('').catch(() => {});
      }
    });
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'S' || e.key === '4' || e.key === '3')) {
        e.preventDefault();
      }
    });
  </script>

  <!-- Jitsi Meet IFrame API - carga diferida para no bloquear Flutter -->
  <script src="https://meet.jit.si/external_api.js" async></script>

  <script>
    step('Cargando bootstrap…');
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      step('Flutter listo — ocultando loader');
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });

    // If Flutter never fires flutter-first-frame within 30s, show an error.
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        showError('Flutter no respondió en 30s. Verifica la conexión o intenta en modo normal (no privado).');
      }
    }, 30000);
  </script>
</body>
</html>
